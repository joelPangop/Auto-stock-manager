# =============================================================================
# Configuration de test — base H2 en mémoire, aucune dépendance externe requise.
# Ce fichier remplace entièrement src/main/resources/application.properties
# lorsque les tests s'exécutent (target/test-classes précède target/classes
# sur le classpath de test).
# =============================================================================
spring.application.name=autos-stock-manager-tests

# =============================================================================
# BASE DE DONNEES — H2 en mémoire (mode compatibilité MySQL)
# =============================================================================
spring.datasource.url=jdbc:h2:mem:autostock-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# schema.sql (table technique non gérée par Hibernate) exécuté sur la base embarquée
spring.sql.init.mode=embedded

# =============================================================================
# JWT — valeurs de test fixes (aucune valeur par défaut dans le code de prod)
# =============================================================================
security.jwt.secret=VGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2Q=
security.jwt.access-expiration=900000
security.jwt.refresh-expiration=1209600000

# =============================================================================
# CORS
# =============================================================================
app.cors.allowed-origins=http://localhost:4200

# =============================================================================
# UPLOAD DE FICHIERS
# =============================================================================
autostock.docs.dir=target/test-uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# =============================================================================
# EMAIL (désactivé en test — pas d'envoi réel)
# =============================================================================
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# =============================================================================
# SMS via Twilio (désactivé en test)
# =============================================================================
twilio.account-sid=
twilio.auth-token=
twilio.from-number=

# =============================================================================
# AWS / LocalStack — clients construits mais jamais appelés par les scénarios
# des modules couverts (Voiture/Stock, Vente/Paiement, Idempotency)
# =============================================================================
aws.endpoint-override=
aws.region=us-east-1
aws.access-key-id=test
aws.secret-access-key=test
aws.s3.bucket=test-bucket
aws.ses.from=test@example.com
aws.sqs.notifications-url=https://sqs.us-east-1.amazonaws.com/000000000000/test-queue

# =============================================================================
# LOGS — silencieux pendant les tests
# =============================================================================
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.transaction=WARN
logging.level.io.cucumber=INFO
